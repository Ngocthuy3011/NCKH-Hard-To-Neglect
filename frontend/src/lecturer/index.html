<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện Hệ thống Điểm danh</title>
    <style>
        :root {
            --navy-blue: #1e2a5e;
            /* --grid-color: rgba(255, 0, 0, 0.1); Màu lưới đỏ nhạt để đối chiếu */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: var(--navy-blue);
            color: white;
            text-align: center;
            padding: 18px 0;
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* User Bar */
        .user-info {
            background-color: #000;
            color: #fff;
            padding: 8px 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        /* Main Content với Grid Background mô phỏng pixel */
        main {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Tạo lưới pixel để bạn dễ đối chiếu kích thước */
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 8px 100%; /* Giả lập các cột grid */
        }

        /* Container chia theo 12 cột */
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 64px; /* Khoảng cách giữa các cột (Gutter) */
            /* Căn giữa toàn bộ cụm nút */
            justify-content: center;
            width: 100%;
            max-width: 928px;
            padding: 80px 0;
        }

        /* Box thành phần */
        .card {
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border: 2px solid #ccc;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.8);
            border-color: var(--navy-blue);
            transform: scale(1.02);
        }

        .card span {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            text-transform: uppercase;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>HỆ THỐNG ĐIỂM DANH BẰNG<br>NHẬN DIỆN KHUÔN MẶT</h1>
    </header>

    <div class="user-info">
        <span>Nguyễn Văn A</span>
        <div style="width: 24px; height: 24px; background: #666; border-radius: 50%;"></div>
        <img src="https://flagcdn.com/w20/vn.png" alt="VN">
    </div>

    <main>
        <div class="container">
            <div class="card"><span>ĐIỂM DANH</span></div>
            <div class="card"><span>THỐNG KÊ</span></div>
            <div class="card"><span>THÔNG TIN -<br>QUẢN LÝ</span></div>
        </div>
    </main>

</body>
</html>
